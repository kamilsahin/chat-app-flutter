name: chat_app_flutter
description: "Flutter chat package for chat-app backend. Real-time messaging with WebSocket/STOMP."
version: 0.1.11
homepage: https://github.com/kamilsahin/chat-app-flutter

environment:
  sdk: ^3.8.1
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # WebSocket / STOMP
  stomp_dart_client: ^3.0.1

  # HTTP
  dio: ^5.7.0

  # Local storage (token cache)
  shared_preferences: ^2.3.3

  # Image picker & cache
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Link detection
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
